[package]
name = "formula-capture"
version = "0.1.0"
edition = "2024"
publish = false

# Headless rendering of the workbench: the README's screenshots and GIFs
# (`formula-capture`, docs/media) and the narrated Shorts (`formula-render`,
# driven by tools/shorts). Kept out of the main crate so its wgpu renderer does
# not slow down `cargo test`.
[workspace]

[lib]
name = "formula_capture"
path = "src/lib.rs"

[[bin]]
name = "formula-capture"
path = "src/main.rs"

[[bin]]
name = "formula-render"
path = "src/bin/render.rs"

[dependencies]
formula = { path = "../.." }
egui = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
