[project]
name = "formula-shorts"
version = "0.1.0"
description = "Narrated YouTube/Instagram Shorts of Formula tools"
requires-python = ">=3.11,<3.14"
dependencies = [
    "edge-tts>=7.0",
    "httpx>=0.27",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
formula-shorts = "formula_shorts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formula_shorts"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
