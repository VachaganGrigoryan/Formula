<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Workbench</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1A1E23; }
  #formula_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="formula_canvas"></canvas>
<script>
  // The workspace uses Ctrl+D (duplicate), Ctrl+0 / Ctrl+= / Ctrl+- (zoom),
  // Ctrl+A, Ctrl+S and Ctrl+O; keep the browser from bookmarking, page-zooming,
  // selecting, saving the page or opening its own file picker.
  window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && ["d", "0", "=", "+", "-", "a", "s", "o"].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  }, { capture: true });
  // Ctrl+wheel would zoom the page instead of the canvas.
  window.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
</script>
<script type="module">
  import init from "./pkg/formula.js";
  init();
</script>
</body>
</html>
