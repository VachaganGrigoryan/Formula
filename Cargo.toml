[package]
name = "formula"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "History", "HtmlCanvasElement", "Location", "Window", "console"] }

[profile.release]
opt-level = 3
lto = true

# The Fourier transforms run once per animal; keep them quick in debug builds too.
[profile.dev.package."*"]
opt-level = 2
