[package]
name = "formula"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1.1"
serde_json = "1.0.154"

[features]
# Sound on the native desktop build. Off by default because on Linux it needs
# the ALSA development headers (libasound2-dev). The web build always has sound.
native-audio = ["dep:cpal"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "GainNode",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "OscillatorNode",
    "OscillatorType",
    "Url",
    "Window",
    "console",
] }

[profile.release]
opt-level = 3
lto = true

# The Fourier transforms run once per animal; keep them quick in debug builds too.
[profile.dev.package."*"]
opt-level = 2
